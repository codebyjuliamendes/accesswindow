services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-accesswindow}
      POSTGRES_USER: ${POSTGRES_USER:-accesswindow}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  app:
    build: .
    image: accesswindow:local
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: jdbc:postgresql://db:5432/${POSTGRES_DB:-accesswindow}
      DATABASE_USERNAME: ${POSTGRES_USER:-accesswindow}
      DATABASE_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      APP_TIME_ZONE: ${APP_TIME_ZONE:-UTC}
      DEMO_SEED: ${DEMO_SEED:-false}
      REVIEW_DUE_SOON_DAYS: ${REVIEW_DUE_SOON_DAYS:-14}
      ACTOR_HEADER: ${ACTOR_HEADER:-}
      HSTS_ENABLED: ${HSTS_ENABLED:-false}
      FORWARD_HEADERS_STRATEGY: ${FORWARD_HEADERS_STRATEGY:-none}
    ports:
      - "${APP_PORT:-8080}:8080"
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped

volumes:
  db-data:
