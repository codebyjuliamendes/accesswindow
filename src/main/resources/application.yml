spring:
  application:
    name: accesswindow
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/accesswindow}
    username: ${DATABASE_USERNAME:accesswindow}
    password: ${DATABASE_PASSWORD:}
    hikari:
      maximum-pool-size: ${DATABASE_POOL_SIZE:10}
      connection-timeout: 5000
  flyway:
    enabled: true
    locations: classpath:db/migration
  jackson:
    default-property-inclusion: always
    deserialization:
      fail-on-null-for-primitives: true
  web:
    resources:
      cache:
        cachecontrol:
          no-cache: true
        use-last-modified: true
  mvc:
    problemdetails:
      enabled: true

server:
  port: ${PORT:8080}
  shutdown: graceful
  forward-headers-strategy: ${FORWARD_HEADERS_STRATEGY:none}
  compression:
    enabled: true
    mime-types: application/json,application/problem+json,text/css,text/javascript,application/javascript,text/html,text/csv,image/svg+xml
  error:
    whitelabel:
      enabled: false
    include-message: never
    include-stacktrace: never
  tomcat:
    max-swallow-size: 64KB
    max-http-form-post-size: 16KB
  max-http-request-header-size: 16KB

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
  info:
    env:
      enabled: false

logging:
  structured:
    format:
      console: ${LOG_FORMAT:ecs}
    ecs:
      service:
        name: accesswindow
  level:
    root: INFO

accesswindow:
  time-zone: ${APP_TIME_ZONE:UTC}
  demo-seed: ${DEMO_SEED:false}
  review:
    due-soon-days: ${REVIEW_DUE_SOON_DAYS:14}
    max-horizon-days: ${REVIEW_MAX_HORIZON_DAYS:365}
  security:
    actor-header: ${ACTOR_HEADER:}
    max-payload-bytes: ${MAX_PAYLOAD_BYTES:16384}
    hsts: ${HSTS_ENABLED:false}
    rate-limit:
      enabled: ${RATE_LIMIT_ENABLED:true}
      capacity: ${RATE_LIMIT_WRITES:30}
      period: ${RATE_LIMIT_PERIOD:1m}
