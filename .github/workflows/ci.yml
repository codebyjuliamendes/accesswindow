name: CI

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint and test (H2)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v6
      - run: ./gradlew check
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: reports
          path: build/reports

  postgres:
    name: Test (PostgreSQL)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: accesswindow
          POSTGRES_USER: accesswindow
          POSTGRES_PASSWORD: accesswindow
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U accesswindow"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/accesswindow
      SPRING_DATASOURCE_USERNAME: accesswindow
      SPRING_DATASOURCE_PASSWORD: accesswindow
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v6
      - run: ./gradlew test

  docker:
    name: Image build and smoke test
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v5
      - name: Start stack
        run: |
          cp .env.example .env
          sed -i 's/^POSTGRES_PASSWORD=.*/POSTGRES_PASSWORD=ci-secret/; s/^DEMO_SEED=.*/DEMO_SEED=true/' .env
          docker compose up -d --build --wait --wait-timeout 180
      - name: Smoke test
        run: |
          set -euo pipefail
          curl -fsS http://localhost:8080/api/health | grep -q '"UP"'
          curl -fsS http://localhost:8080/api/summary | grep -q '"total":5'
          curl -fsSI http://localhost:8080/ | grep -qi "content-security-policy: default-src 'none'"
          curl -fsS http://localhost:8080/api/review-due.csv | head -1 | grep -q '^email,resource,role'
          code=$(curl -s -o /dev/null -w '%{http_code}' -X POST -H 'Content-Type: application/json' -d '{}' http://localhost:8080/api/access)
          test "$code" = 400
          test "$(docker compose exec -T app id -u)" = 10001
      - name: Logs
        if: always()
        run: docker compose logs app
      - if: always()
        run: docker compose down -v
